name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dkotlin.incremental=false

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Install SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Grant wrapper
        run: chmod +x gradlew
      - name: Domain tests
        run: ./gradlew --no-daemon --max-workers=2 :domain:test
      - name: App unit tests
        run: ./gradlew --no-daemon --max-workers=2 :app:testDebugUnitTest
      - name: Lint
        run: ./gradlew --no-daemon --max-workers=2 :app:lintDebug
      - name: Assemble debug
        run: ./gradlew --no-daemon --max-workers=2 :app:assembleDebug
      - name: Compile androidTest
        run: ./gradlew --no-daemon --max-workers=2 :app:compileDebugAndroidTestKotlin

  release-unsigned:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: Install SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Grant wrapper
        run: chmod +x gradlew
      - name: Assemble release
        run: ./gradlew --no-daemon --max-workers=2 :app:assembleRelease

  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.4.5
      - name: Edge function tests
        run: deno test --allow-env --allow-net=deno.land supabase/functions
