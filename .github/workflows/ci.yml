name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Só cancela em PR: num push para main, cancelar a execução anterior poderia
  # esconder um merge quebrado que ainda estava sendo validado.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dkotlin.incremental=false

jobs:
  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.4.5
      - name: Edge function tests
        run: deno test --allow-env --allow-net=deno.land supabase/functions

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Install SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Grant wrapper
        run: chmod +x gradlew
      - name: Testes, lint e builds
        run: |
          ./gradlew --no-daemon --max-workers=2 \
            :domain:test \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleDebug \
            :app:compileDebugAndroidTestKotlin
      # O assembleRelease fica fora do bloco acima de proposito: aqui ele roda com valores-sentinela
      # para provar, a cada PR, que a config do Supabase atravessa o Gradle e chega no dex. Antes
      # isso so era exercitado na tag, com o secret real -- se a injecao quebrasse, o release
      # quebrava so na hora de publicar. Nenhum secret entra neste passo.
      - name: Release com config sentinela e conferencia no dex
        env:
          SUPABASE_URL: "https://ci-sentinela-fala-agenda.supabase.co"
          SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJjaS1zZW50aW5lbGEtZmFsYS1hZ2VuZGEiLCJyb2xlIjoiYW5vbiJ9.SENTINELA-DO-CI-NAO-E-CHAVE-REAL"
        run: |
          ./gradlew --no-daemon --max-workers=2 :app:assembleRelease
          # O mesmo caminho que o passo "Publicar release" de release.yml anexa ao criar a tag.
          # Nada mais exercita release.yml antes de uma tag, entao a conferencia do mapping mora
          # aqui, de graca, a cada PR: se AGP, saida do R8 ou buildType mudarem, o erro aparece
          # neste job, nao numa publicacao abortada (ou pior: completada sem mapping).
          if [ ! -f app/build/outputs/mapping/release/mapping.txt ]; then
            echo "::error::mapping.txt do R8 ausente apos assembleRelease -- o gate da tag nao ia achar o caminho."
            exit 1
          fi
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::APK de release nao encontrado em app/build/outputs/apk/release"
            exit 1
          fi
          DEX="$RUNNER_TEMP/dex-ci"
          rm -rf "$DEX"
          mkdir -p "$DEX"
          if ! unzip -o -q "$APK" "classes*.dex" -d "$DEX" || [ -z "$(ls -A "$DEX")" ]; then
            echo "::error::Nao consegui extrair classes*.dex de $APK"
            exit 1
          fi
          faltando=0
          if ! grep -aqF -- "$SUPABASE_URL" "$DEX"/classes*.dex; then
            echo "::error::SUPABASE_URL nao chegou ao dex do release: a injecao da config esta quebrada e o release por tag sairia sem a ajuda extra."
            faltando=1
          fi
          if ! grep -aqF -- "$SUPABASE_ANON_KEY" "$DEX"/classes*.dex; then
            echo "::error::SUPABASE_ANON_KEY nao chegou ao dex do release: a injecao da config esta quebrada e o release por tag sairia sem a ajuda extra."
            faltando=1
          fi
          [ "$faltando" -eq 0 ] || exit 1
          echo "Config sentinela presente no dex do release."
      - name: "Aviso: versionName x ultima release"
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ATUAL=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | head -n 1 | cut -d'"' -f2)
          if [ -z "$ATUAL" ]; then
            echo "Nao consegui ler versionName de app/build.gradle.kts."
            exit 0
          fi

          ULTIMA=$(gh release list --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)
          ULTIMA="${ULTIMA#v}"
          if [ -z "$ULTIMA" ]; then
            echo "Nenhuma release publicada ainda; aviso ignorado."
            exit 0
          fi
          MAIOR=$(printf '%s\n%s\n' "$ATUAL" "$ULTIMA" | sort -V | tail -n 1)
          if [ "$MAIOR" != "$ATUAL" ] || [ "$ATUAL" = "$ULTIMA" ]; then
            echo "::warning::versionName $ATUAL nao e maior que a ultima release (v$ULTIMA); se este PR fecha uma release, bumpe versionName e versionCode."
          else
            echo "versionName $ATUAL > ultima release v$ULTIMA."
          fi
