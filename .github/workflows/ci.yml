name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Grant wrapper
        run: chmod +x gradlew
      - name: Lint, test, assembleDebug
        run: ./gradlew --no-daemon lint test assembleDebug

  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.1.4
      - name: Edge function tests
        run: deno test --allow-env --allow-net=deno.land supabase/functions
