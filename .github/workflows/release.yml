name: Release

on:
  push:
    tags:
      - "v*"

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dkotlin.incremental=false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: Install SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Rebuild keystore from secrets
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "RELEASE_KEYSTORE_BASE64 ausente"
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Conferir config do Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # -z sozinho deixava passar secret com espaco/quebra de linha: o app usa
          # isNotBlank(), entao " " era aceito aqui e desligava a ajuda extra no aparelho.
          so_espaco() { [ -z "${1//[[:space:]]/}" ]; }
          faltando=0
          # if, nao "&& { }": a ausencia precisa de aviso, e aviso pede else -- && nao tem. (O
          # ramo falso de && sob bash -e NAO aborta o passo no meio do script; so pelo exit code
          # se for a ultima linha. Corrigido em 03/10: a frase anterior ensinava o contrario.)

          # O case com https://*.supabase.co era furado: em glob o * casa /, ? e # tambem, entao
          # https://evil.example#.supabase.co e https://a/b.supabase.co passavam. Como a URL vai
          # para o APK e o app manda o token do aparelho para ela, isso era exfiltracao de
          # credencial por secret mal configurado. Regex ancorada: so host, e so o sufixo exato.
          # O case de espaco vem antes porque o grep casa linha a linha: uma URL com \n no meio
          # passaria pela regex na primeira linha.
          url_valida() {
            case "$1" in
              *[[:space:]]*) return 1 ;;
            esac
            printf '%s' "$1" | grep -qE '^https://[a-z0-9-]+\.supabase\.co/?$'
          }

          # O JWT do Supabase carrega o papel no payload. service_role ignora RLS: num APK
          # distribuido, quem extrair a chave fica com o banco inteiro. So anon/public entra.
          # Nao imprime a chave nem o payload, so o papel (ou nada, se nao decodificar).
          papel_da_chave() {
            local payload pad
            case "$1" in
              *.*.*) ;;
              *) return 1 ;;
            esac
            payload="${1#*.}"
            payload="${payload%%.*}"
            [ -n "$payload" ] || return 1
            pad="$payload"
            case $(( ${#pad} % 4 )) in
              2) pad="${pad}==" ;;
              3) pad="${pad}=" ;;
              1) return 1 ;;
            esac
            printf '%s' "$pad" | tr '_' '/' | tr '-' '+' \
              | base64 --decode 2>/dev/null | jq -er '.role // empty' 2>/dev/null
          }

          if so_espaco "$SUPABASE_URL"; then echo "::error::SUPABASE_URL vazio"; faltando=1; fi
          if so_espaco "$SUPABASE_ANON_KEY"; then echo "::error::SUPABASE_ANON_KEY vazio"; faltando=1; fi
          if ! so_espaco "$SUPABASE_URL" && ! url_valida "$SUPABASE_URL"; then
            echo "::error::SUPABASE_URL nao e exatamente https://<projeto>.supabase.co (sem caminho, porta, ? ou #; valor nao exibido)"
            faltando=1
          fi
          if ! so_espaco "$SUPABASE_ANON_KEY"; then
            PAPEL=$(papel_da_chave "$SUPABASE_ANON_KEY" || true)
            if [ "$PAPEL" != "anon" ]; then
              echo "::error::SUPABASE_ANON_KEY nao e chave anon/public (JWT com role=anon). A service_role entrega o banco a quem extrair a chave do APK. Chave e payload nao exibidos."
              faltando=1
            fi
          fi
          if [ "$faltando" -ne 0 ]; then
            echo "Sem as duas o APK sai sem a ajuda extra (SupabaseConfig.isConfigured = false)."
            echo "Configure em Settings > Secrets and variables > Actions > Secrets:"
            echo "  SUPABASE_URL      = https://SEU-PROJETO.supabase.co"
            echo "  SUPABASE_ANON_KEY = chave anon/publica (JWT com role=anon; nunca a service_role)"
            exit 1
          fi
          # Uma barra no fim e um valor correto e era reprovado aqui. O que entra no APK e a URL
          # sem barra final: os steps seguintes leem de GITHUB_ENV e nao releem o secret.
          echo "SUPABASE_URL=${SUPABASE_URL%/}" >> "$GITHUB_ENV"
          echo "Config do Supabase conferida (URL normalizada sem barra final; valores nao exibidos)."
      - name: Assemble signed release
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 :app:assembleRelease
      - name: Verify signature and SHA-256
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          sha256sum "$APK" | tee "$RUNNER_TEMP/apk.sha256"
      - name: Gate do artefato
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          BT="$ANDROID_HOME/build-tools/36.0.0"
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::APK nao encontrado em app/build/outputs/apk/release"
            exit 1
          fi

          # (a) a config do Supabase tem que estar dentro do dex
          falhou=0
          so_espaco() { [ -z "${1//[[:space:]]/}" ]; }
          # Mesma regex ancorada do passo de conferencia: aqui SUPABASE_URL vem do GITHUB_ENV,
          # ja normalizada pelo passo anterior.
          url_valida() {
            case "$1" in
              *[[:space:]]*) return 1 ;;
            esac
            printf '%s' "$1" | grep -qE '^https://[a-z0-9-]+\.supabase\.co/?$'
          }
          if so_espaco "$SUPABASE_URL" || so_espaco "$SUPABASE_ANON_KEY"; then
            echo "::error::SUPABASE_URL/SUPABASE_ANON_KEY vazios neste step (repository secrets nao configurados)."
            exit 1
          fi
          # Busca por espaco em branco casaria com qualquer byte do dex e passaria verde.
          if ! url_valida "$SUPABASE_URL"; then
            echo "::error::SUPABASE_URL nao e exatamente https://<projeto>.supabase.co"
            falhou=1
          fi
          DEX="$RUNNER_TEMP/dex"
          rm -rf "$DEX"
          mkdir -p "$DEX"
          if ! unzip -o -q "$APK" "classes*.dex" -d "$DEX" || [ -z "$(ls -A "$DEX")" ]; then
            echo "::error::Nao consegui extrair classes*.dex de $APK"
            exit 1
          fi
          if ! grep -aqF -- "$SUPABASE_URL" "$DEX"/classes*.dex; then
            echo "::error::SUPABASE_URL nao esta no dex: o APK foi compilado sem essa variavel."
            falhou=1
          fi
          if ! grep -aqF -- "$SUPABASE_ANON_KEY" "$DEX"/classes*.dex; then
            echo "::error::SUPABASE_ANON_KEY nao esta no dex: o APK foi compilado sem essa variavel."
            falhou=1
          fi

          # (b) versionName do APK tem que casar com a tag. Tag com sufixo (v0.6.0-rc1) e
          # pre-release: o versionName do app e a versao base (0.6.0), entao compara com ela e a
          # publicacao sai marcada como prerelease -- /releases/latest, que e o que o app le,
          # nunca devolve pre-release. Sem isso a tag -rc1 reprovava o gate e, se publicada como
          # estavel, o app ofereceria um rc como atualizacao.
          TAG="${GITHUB_REF_NAME#v}"
          case "$TAG" in
            *-*) PRERELEASE=1; ESPERADO="${TAG%%-*}" ;;
            *) PRERELEASE=0; ESPERADO="$TAG" ;;
          esac
          # `|| true` nas leituras de versao: o shell padrao do runner (`bash -e`, sem
          # `pipefail`) tolera um `grep` sem resultado, mas com `shell: bash` o passo roda com
          # `-o pipefail` e ai o `grep` vazio derruba o passo inteiro em silencio -- levando
          # junto o fallback abaixo e os avisos que este gate existe para dar.
          ATUAL=$("$BT/aapt2" dump badging "$APK" 2>/dev/null | grep -m1 "^package:" \
            | grep -oE "versionName='[^']*'" | head -n 1 | cut -d"'" -f2 || true)
          if [ -z "$ATUAL" ]; then
            ATUAL=$(grep -oE '"versionName": *"[^"]+"' app/build/outputs/apk/release/output-metadata.json \
              | head -n 1 | cut -d'"' -f4 || true)
          fi
          if [ "$ATUAL" != "$ESPERADO" ]; then
            echo "::error::versionName do APK e '$ATUAL' e a tag e '$GITHUB_REF_NAME' (esperado '$ESPERADO'). Bumpe versionName/versionCode em app/build.gradle.kts antes de taguear."
            falhou=1
          fi
          if [ "$PRERELEASE" -eq 1 ]; then
            echo "Tag '$GITHUB_REF_NAME' tem sufixo: vai como prerelease (o app ignora)."
          fi

          # (c) assinatura igual a da release anterior (senao o auto-update nao instala por cima)
          CERT_ATUAL=$("$BT/apksigner" verify --print-certs "$APK" \
            | grep -m1 -F "certificate SHA-256 digest:" | awk -F': ' '{print $NF}')
          if [ -z "$CERT_ATUAL" ]; then
            echo "::error::Nao consegui ler a impressao digital do APK novo."
            exit 1
          fi
          # O versionCode sai do proprio APK; o output-metadata.json e o mesmo fallback que o
          # versionName usa quando o aapt2 nao responde. O major (versionCodeMajor) fica de
          # fora: app/build.gradle.kts nunca o define, e nada aqui depende dele.
          # Leitura vazia chega ao `inteiro` abaixo e vira aviso: e o caminho de fail-open.
          VC_ATUAL=$("$BT/aapt2" dump badging "$APK" 2>/dev/null | grep -m1 "^package:" \
            | grep -oE "versionCode='[^']*'" | head -n 1 | cut -d"'" -f2 || true)
          if [ -z "$VC_ATUAL" ]; then
            VC_ATUAL=$(grep -oE '"versionCode": *[0-9]+' app/build/outputs/apk/release/output-metadata.json \
              | head -n 1 | grep -oE '[0-9]+$' || true)
          fi
          ANTERIOR=$(gh release list --exclude-drafts --limit 10 --json tagName --jq '.[].tagName' 2>/dev/null \
            | grep -vx -- "$GITHUB_REF_NAME" | head -n 1 || true)
          # Fail-open so quando a release anterior nao pode ser determinada (nao existe, ou a
          # listagem falhou): o gate segue e o aviso fica no log. Travar a publicacao por causa
          # de uma chamada de API e pior que a deriva que ele previne, e a deriva e rara -- o
          # historico tem 15 pares versionCode/versionName em dia (9/0.3.0 ... 15/0.6.0). Se a
          # release anterior existe mas o APK dela nao baixa, continua sendo erro: sem o
          # arquivo nao ha como comparar nada.
          if [ -z "$ANTERIOR" ]; then
            echo "::warning::Nenhuma release anterior: assinatura e versionCode nao comparados; publicacao segue."
          else
            if ! gh release download "$ANTERIOR" --pattern "app-release.apk" --dir "$RUNNER_TEMP/anterior" --clobber; then
              echo "::error::Falha ao baixar o app-release.apk da release $ANTERIOR para comparar a assinatura e o versionCode."
              exit 1
            fi
            CERT_ANTERIOR=$("$BT/apksigner" verify --print-certs "$RUNNER_TEMP/anterior/app-release.apk" \
              | grep -m1 -F "certificate SHA-256 digest:" | awk -F': ' '{print $NF}')
            if [ -z "$CERT_ANTERIOR" ]; then
              echo "::error::Nao consegui ler a impressao digital do APK de $ANTERIOR."
              exit 1
            fi
            if [ "$CERT_ATUAL" != "$CERT_ANTERIOR" ]; then
              echo "::error::Assinatura diferente da release $ANTERIOR: $CERT_ATUAL != $CERT_ANTERIOR. Use o mesmo keystore, senao o app instalado nao aceita a atualizacao."
              falhou=1
            fi

            # (d) versionCode estritamente maior que o da release anterior. O versionName sozinho
            # deixa passar um APK que ninguem consegue instalar: com o versionCode repetido (ou
            # menor), o aplicativo instalado recusa a atualizacao como rebaixamento e ela para de
            # chegar justamente em quem ja tem aquele numero -- calado, porque a release esta
            # publicada e a tela continua dizendo "Tem versao nova".
            VC_ANTERIOR=$("$BT/aapt2" dump badging "$RUNNER_TEMP/anterior/app-release.apk" 2>/dev/null | grep -m1 "^package:" \
              | grep -oE "versionCode='[^']*'" | head -n 1 | cut -d"'" -f2 || true)
            inteiro() { case "$1" in ''|*[!0-9]*) return 1 ;; esac; }
            if ! inteiro "$VC_ATUAL" || ! inteiro "$VC_ANTERIOR"; then
              echo "::warning::Nao consegui ler o versionCode do APK novo ('$VC_ATUAL') ou do de $ANTERIOR ('$VC_ANTERIOR'); comparacao de versao ignorada."
            else
              echo "versionCode: $VC_ANTERIOR na release $ANTERIOR, $VC_ATUAL agora."
              if [ "$VC_ATUAL" -le "$VC_ANTERIOR" ]; then
                echo "::error::versionCode do APK e $VC_ATUAL e o da release $ANTERIOR e $VC_ANTERIOR: o novo nao e maior, e o aplicativo instalado recusa a atualizacao como rebaixamento. Bumpe versionCode e versionName em app/build.gradle.kts antes de taguear."
                falhou=1
              fi
            fi
          fi

          [ "$falhou" -eq 0 ] || exit 1
          echo "PRERELEASE=$PRERELEASE" >> "$GITHUB_ENV"
          echo "Gate do artefato OK."
      - name: Publicar release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          ASSETS=("$APK" "$RUNNER_TEMP/apk.sha256")
          # Com minify na release, stack frame de biblioteca (Compose/Tink/JNA) chega renomeado
          # e o unico registro que decifra o crash de uma versao taggada e o mapping deste build
          # -- que hoje morre no filesystem efemero do runner (o job inteiro dura ~4 minutos).
          # Attach no proprio release = o mapping dura enquanto a versao dura. O app escolhe seus
          # assets por sufixo (.apk/.sha256, AppUpdater.kt:276-277), entao um .txt a mais nao
          # sequestra o download. if (nao &&): o ramo da ausencia precisa dar aviso, e && nao tem
          # else; sob bash -e um && falso so derruba o passo quando e a ultima linha, pelo exit
          # code -- no meio do script ele passa mudo.
          MAP="app/build/outputs/mapping/release/mapping.txt"
          if [ -f "$MAP" ]; then
            ASSETS+=("$MAP")
          elif [ "${PRERELEASE:-0}" = "1" ]; then
            # No rc o publish vale mais que o gate: o rc existe para o smoke no aparelho, e
            # travar a publicacao por falta de mapa deixaria o aparelho sem nada para testar.
            echo "::warning::mapping.txt ausente no rc: crash desta build fica indecifavel, mas o smoke nao espera mapa."
          else
            # Estavel sem mapping recria a falha silenciosa na direcao oposta: publicada, passo
            # verde, e o unico registro que existia foi junto com o runner. Se um dia o minify
            # for desligado de proposito, o lugar de dizer isso e remover este gate -- nao deixar
            # o arquivo sumir. O CI de PR confere o assembleRelease e o caminho (mesmo passo).
            echo "::error::mapping.txt ausente numa estavel: com isMinifyEnabled=true isso e build sem R8 ou caminho que mudou. O CI de PR ja confere os dois; se chegou aqui, conferir app/build.gradle.kts antes de forcar a tag."
            exit 1
          fi
          # Pre-release nunca vira "latest" no GitHub: /releases/latest continua apontando para a
          # ultima estavel, entao o app nao oferece o rc como atualizacao.
          if [ "${PRERELEASE:-0}" = "1" ]; then
            gh release create "$GITHUB_REF_NAME" "${ASSETS[@]}" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --clobber \
              --prerelease
          else
            gh release create "$GITHUB_REF_NAME" "${ASSETS[@]}" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --clobber
          fi
