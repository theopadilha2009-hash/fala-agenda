org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.workers.max=2
android.useAndroidX=true
android.nonTransitiveRClass=true
android.builtInKotlin=true
# KSP 2.3.1 ainda registra generated sources em kotlin.sourceSets.
# Sem isto o AGP 9.3 recusa o módulo; a correção estável é o KSP passar a android.sourceSets.
android.disallowKotlinSourceSets=false
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE
kotlin.code.style=official
kotlin.incremental=true
kotlin.daemon.jvmargs=-Xmx1g
